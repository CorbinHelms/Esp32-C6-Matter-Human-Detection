[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6 --partition-table partitions.csv"

[env]
# esp_radio's 802.15.4 "Receive queue full" warn fires from the radio *ISR*; over
# the blocking USB-Serial-JTAG logger it stalls the executor under Thread load
# (starves the radio-drain task + the sensor UART -> CASE never completes and
# commissioning rolls back). Filtering it out makes that warn a no-op (never
# formatted/written), so the ISR can't block. OpenThread stays at `info` for now
# to keep full visibility into the Thread attach + SRP registration while we
# diagnose why the operational handshake stalls; only the catastrophic esp_radio
# ISR warn is filtered.
# `openthread=info` keeps OT NOTE-level events visible while muting the very
# chatty INFO internals (SrpClient/MLE/MeshForwarder map to log::debug!) —
# each debug line costs a blocking USB-Serial-JTAG write on the main executor,
# which measurably starves radio-adjacent tasks during commissioning. Switch
# to `openthread=debug` when deep OT diagnostics are needed.
ESP_LOG="info,esp_radio=off,openthread=info"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["core", "alloc", "panic_abort"]
