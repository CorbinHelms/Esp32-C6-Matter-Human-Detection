[package]
edition      = "2024"
name         = "esp32c6-matter-human-detection"
description  = "Baremetal Rust firmware: XIAO ESP32-C6 + 24GHz mmWave presence sensor as a Matter Occupancy Sensor over Thread for Google Home"
license      = "MIT"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32c6-matter-human-detection"
path = "./src/bin/main.rs"

# Thread range extender (no Matter/sensor) — needs the router-capable (FTD)
# OpenThread library, so a plain `cargo build` skips it:
#   cargo build --release --features ftd --bin repeater
[[bin]]
name = "repeater"
path = "./src/bin/repeater.rs"
required-features = ["ftd"]

[features]
# Link libopenthread-ftd (router/leader roles) instead of the MTD library.
ftd = ["openthread/ftd"]

[dependencies]
# --- Espressif baremetal HAL / runtime / radio (all crates.io) ---
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-radio", "esp-alloc", "esp32c6", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "ble", "log-04", "unstable"] }
esp-alloc = "0.10.0"
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
esp-metadata-generated = { version = "0.4.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }

# --- Embassy async runtime ---
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"

# --- Matter over Thread (rs-matter-embassy is git-only; everything it pulls is crates.io) ---
# Pinned to a reviewed commit (2026-06-25 "Prep for a release"); this stack is
# pre-1.0 and the API moves, so we float nothing.
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "efef8b70b64178a8f8d1460d02ebb6fa146d2d95", features = [
  "esp",
  "log",
  "mbedtls",
  "openthread",
  "openthread-heap-int-8192",
] }
# C-string helpers required by the OpenThread/MbedTLS C code linked under Thread.
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }
# Direct deps for the split-radio architecture (PHY on the interrupt executor)
# and the srp-probe diagnostic binary (same crates rs-matter-embassy already
# pulls in; `openthread` resolves to the vendored copy via [patch]).
openthread = { version = "0.2", features = ["esp-radio"] }
heapless   = { version = "0.9", default-features = false }
bt-hci     = { version = "0.8", default-features = false }

# --- misc ---
log              = "0.4.27"
critical-section = "1.2.0"
static_cell      = "2.1.1"

# Local overrides of the `openthread` crates for the M2 bring-up (see
# patches/README.md; `vendor/` is generated by scripts/vendor.sh and not
# committed):
# - openthread: 802.15.4 RX queue depth 50 -> 200 (frame drops under executor
#   stalls kill SRP/CASE during commissioning; esp-rs/openthread#92)
# - openthread-sys: OpenThread C compiled with OT_LOG_LEVEL=INFO so the SRP
#   client / MLE / MAC internals are visible (surfaced at ESP_LOG
#   openthread=debug)
[patch.crates-io]
openthread     = { path = "vendor/openthread" }
openthread-sys = { path = "vendor/openthread-sys" }
# esp-radio: ISR-safe 802.15.4 diagnostic counters (esp_radio::ieee802154::diag)
esp-radio      = { path = "vendor/esp-radio" }
# rs-matter: (a) one-shot fail-safe grace extension while a commissioning is in
# flight — Google's CASE was observed arriving ~1s AFTER its own 120s fail-safe
# window, right after the fabric rollback; (b) `notify_mdns_changed()` made pub
# so the firmware can re-announce SRP/mDNS during the pairing window.
rs-matter      = { path = "vendor/rs-matter" }

[profile.dev]
# Debug builds are too slow/large for the device; always optimize a little.
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
opt-level        = "s"
overflow-checks  = false
