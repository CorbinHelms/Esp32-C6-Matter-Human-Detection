[package]
edition      = "2024"
name         = "esp32c6-matter-human-detection"
description  = "Baremetal Rust firmware: XIAO ESP32-C6 + 24GHz mmWave presence sensor as a Matter Occupancy Sensor over Thread for Google Home"
license      = "MIT"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32c6-matter-human-detection"
path = "./src/bin/main.rs"

[dependencies]
# --- Espressif baremetal HAL / runtime / radio (all crates.io) ---
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-radio", "esp-alloc", "esp32c6", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "ble", "log-04", "unstable"] }
esp-alloc = "0.10.0"
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
esp-metadata-generated = { version = "0.4.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }

# --- Embassy async runtime ---
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"

# --- Matter over Thread (rs-matter-embassy is git-only; everything it pulls is crates.io) ---
# Pinned to a reviewed commit (2026-06-25 "Prep for a release"); this stack is
# pre-1.0 and the API moves, so we float nothing.
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "efef8b70b64178a8f8d1460d02ebb6fa146d2d95", features = [
  "esp",
  "log",
  "mbedtls",
  "openthread",
  "openthread-heap-int-8192",
] }
# C-string helpers required by the OpenThread/MbedTLS C code linked under Thread.
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }

# --- misc ---
log              = "0.4.27"
critical-section = "1.2.0"
static_cell      = "2.1.1"

[profile.dev]
# Debug builds are too slow/large for the device; always optimize a little.
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
opt-level        = "s"
overflow-checks  = false
